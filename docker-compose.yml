# Voidpost — catch-all disposable mail server.
#
# Configuration comes from .env, the same file a bare `bun start` uses:
# copy .env.example to .env, set DOMAIN and APP_PASSWORD, then:
#
#   docker compose up -d --build
#
# Inbound mail needs TCP 25 published on this host, with the domain's MX record
# pointing at it. If 25 is already taken on the host, move only the host side:
#
#   SMTP_HOST_PORT=2525 docker compose up -d
services:
  voidpost:
    build: .
    image: voidpost:latest
    container_name: voidpost
    restart: unless-stopped

    # Domain, password, size limit and cookie flags come from .env; the
    # retention window is set in the web interface, not here.
    env_file:
      - .env

    environment:
      # Container layout: listen on every interface, keep SQLite on the volume,
      # and pin the listener ports to the ones mapped below so that a
      # host-oriented PORT/SMTP_PORT in .env cannot desynchronise them.
      HOST: 0.0.0.0
      DATA_DIR: /data
      PORT: 3000
      SMTP_PORT: 25

    # Targets are literals on purpose: this Compose version drops an
    # interpolated target port ("invalid port specification: 0/tcp"), so only
    # the host side is configurable and .env needs no extra entries.
    ports:
      - "25:25"
      - "8093:3000"

    volumes:
      - voidpost-data:/data

volumes:
  voidpost-data:
